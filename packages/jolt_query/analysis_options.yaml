include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - no_adjacent_strings_in_list
    - prefer_final_locals
    - strict_top_level_inference
    - unawaited_futures
