name: jolt_lint
description: Lint tool for the Jolt reactive state management ecosystem, providing code quality checks and developer assistance.

repository: https://github.com/vowdemon/jolt

version: 4.0.0-dev.1

topics:
  - jolt
  - state-management
  - signals
  - lint

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  analysis_server_plugin: ^0.3.20
  analyzer: ^14.1.0
  analyzer_plugin: ^0.14.14

dev_dependencies:
  lints: ^5.0.0
  test: ^1.0.0
  analyzer_testing: ^0.3.4
  test_reflective_loader: ^0.2.3
